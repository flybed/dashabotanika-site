<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img" aria-label="Вещи даром: велосипед, детская кроватка, сковородка, телефон, книги и плюшевый мишка">
  <!-- soft ground blob -->
  <ellipse cx="225" cy="268" rx="205" ry="34" fill="#3A6234" opacity=".10"/>
  <path d="M40 150c0-70 60-128 160-128s200 40 200 120-70 120-180 120S40 220 40 150Z" fill="#C9932E" opacity=".13"/>
  <!-- crib (left back) -->
  <g transform="translate(36 120)">
    <rect x="0" y="40" width="130" height="80" rx="10" fill="#F7F3EA" stroke="#AD5E39" stroke-width="5"/>
    <g stroke="#AD5E39" stroke-width="5" stroke-linecap="round">
      <line x1="26" y1="44" x2="26" y2="116"/><line x1="48" y1="44" x2="48" y2="116"/><line x1="70" y1="44" x2="70" y2="116"/><line x1="92" y1="44" x2="92" y2="116"/><line x1="112" y1="44" x2="112" y2="116"/>
      <line x1="4" y1="20" x2="4" y2="138"/><line x1="126" y1="20" x2="126" y2="138"/>
    </g>
    <circle cx="4" cy="16" r="7" fill="#AD5E39"/><circle cx="126" cy="16" r="7" fill="#AD5E39"/>
    <!-- teddy inside -->
    <g transform="translate(56 82)">
      <circle cx="0" cy="-6" r="9" fill="#C9932E"/><circle cx="20" cy="-6" r="9" fill="#C9932E"/>
      <circle cx="10" cy="8" r="16" fill="#C9932E"/><circle cx="10" cy="12" r="7" fill="#F2DDB0"/>
      <circle cx="4" cy="4" r="2.2" fill="#232A1E"/><circle cx="16" cy="4" r="2.2" fill="#232A1E"/>
    </g>
  </g>
  <!-- bicycle (front centre) -->
  <g transform="translate(150 170)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="30" cy="70" r="34" stroke="#232A1E" stroke-width="6"/><circle cx="150" cy="70" r="34" stroke="#232A1E" stroke-width="6"/>
    <circle cx="30" cy="70" r="5" fill="#232A1E"/><circle cx="150" cy="70" r="5" fill="#232A1E"/>
    <path d="M30 70 70 22h62L150 70M70 22l18 48 44-48M88 70H30" stroke="#3A6234" stroke-width="8"/>
    <path d="M62 10h22" stroke="#232A1E" stroke-width="7"/><path d="M132 22l-6-16h18" stroke="#232A1E" stroke-width="6"/>
  </g>
  <!-- frying pan (right top) -->
  <g transform="translate(300 118) rotate(-18) scale(.85)">
    <rect x="58" y="-6" width="74" height="13" rx="6.5" fill="#232A1E"/>
    <circle cx="30" cy="0" r="38" fill="#3B3F36"/><circle cx="30" cy="0" r="30" fill="#55594F"/>
    <!-- egg -->
    <path d="M14 -6c4-14 26-16 32-2 6 12-6 22-18 20-12-1-17-8-14-18Z" fill="#FFFFFF"/><circle cx="30" cy="-1" r="8" fill="#F2B632"/>
  </g>
  <!-- phone (right) -->
  <g transform="translate(366 156) rotate(10)">
    <rect x="0" y="0" width="56" height="98" rx="11" fill="#232A1E"/>
    <rect x="5" y="9" width="46" height="74" rx="5" fill="#8FC3D6"/>
    <path d="M14 58c6-14 22-18 30-30" stroke="#3A6234" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="16" cy="28" r="6" fill="#F7F3EA"/>
    <rect x="20" y="88" width="16" height="4" rx="2" fill="#55594F"/>
  </g>
  <!-- books (left front) -->
  <g transform="translate(20 236)">
    <rect x="0" y="22" width="96" height="18" rx="4" fill="#86A85C"/><rect x="8" y="4" width="84" height="18" rx="4" fill="#AD5E39"/><rect x="2" y="-14" width="80" height="18" rx="4" fill="#C9932E"/>
    <g stroke="#F7F3EA" stroke-width="3" opacity=".7"><line x1="12" y1="31" x2="40" y2="31"/><line x1="20" y1="13" x2="52" y2="13"/><line x1="12" y1="-5" x2="36" y2="-5"/></g>
  </g>
  <!-- gift tag «даром» -->
  <g transform="translate(150 28) rotate(-6)">
    <path d="M0 14 14 0h92a8 8 0 0 1 8 8v28a8 8 0 0 1-8 8H14L0 30Z" fill="#3A6234"/>
    <circle cx="14" cy="22" r="4.5" fill="#F7F3EA"/>
    <text x="64" y="30" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#F7F3EA">даром</text>
    <path d="M-2 22c-14 6-24 2-30-8" stroke="#3A6234" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- little sparkles -->
  <g fill="#C9932E"><path d="M330 40l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/><path d="M400 260l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></g>
</svg>
